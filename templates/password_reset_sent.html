{% extends 'base.html' %}
{% load static %}

{% block title %}Forgot Password - HostelLink{% endblock %}

{% block extra_css %}
<style>
    .auth-section {
        min-height: calc(100vh - 76px);
        display: flex;
        align-items: center;
        background: linear-gradient(135deg, #F9FAFB 0%, #E0E7FF 100%);
        padding: 2rem 0;
    }

    .auth-card {
        animation: fadeInUp 0.5s ease-out;
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .icon-wrapper {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #0A74DA 0%, #667eea 100%);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
        box-shadow: 0 10px 25px rgba(10, 116, 218, 0.3);
    }

    .form-control:focus {
        border-color: #0A74DA;
        box-shadow: 0 0 0 0.25rem rgba(10, 116, 218, 0.15);
    }

    .btn-primary {
        background: linear-gradient(135deg, #0A74DA 0%, #667eea 100%);
        border: none;
        padding: 0.75rem 2rem;
        font-weight: 600;
        transition: all 0.3s ease;
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(10, 116, 218, 0.4);
    }

    .steps-indicator {
        display: flex;
        justify-content: space-between;
        margin-bottom: 2rem;
    }

    .step {
        flex: 1;
        text-align: center;
        position: relative;
        padding: 0.5rem;
    }

    .step::before {
        content: '';
        position: absolute;
        top: 15px;
        left: 50%;
        width: 100%;
        height: 2px;
        background: #E5E7EB;
        z-index: -1;
    }

    .step:first-child::before {
        left: 50%;
        width: 50%;
    }

    .step:last-child::before {
        width: 50%;
        left: 0;
    }

    .step-circle {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: #E5E7EB;
        color: #6B7280;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 0.875rem;
        margin-bottom: 0.5rem;
        transition: all 0.3s ease;
    }

    .step.active .step-circle {
        background: linear-gradient(135deg, #0A74DA 0%, #667eea 100%);
        color: white;
        box-shadow: 0 4px 12px rgba(10, 116, 218, 0.4);
    }

    .step.completed .step-circle {
        background: #10B981;
        color: white;
    }

    .alert-custom {
        border-left: 4px solid #0A74DA;
        background-color: #EFF6FF;
        border-radius: 8px;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-lg border-0 auth-card">
                    <div class="card-body p-5">
                        <!-- Icon -->
                        <div class="text-center mb-4">
                            <div class="icon-wrapper">
                                <i class="bi bi-lock-fill text-white" style="font-size: 2.5rem;"></i>
                            </div>
                        </div>

                        <!-- Header -->
                        <div class="text-center mb-4">
                            <h2 class="fw-bold mb-2">Forgot Password?</h2>
                            <p class="text-muted">If a user account exists with that email, we've sent a password reset link to your inbox.</p>
                        </div>
                        <!-- Back to Login -->
                        <div class="text-center">
                            <a href="{% url 'login' %}" class="btn btn-primary">Back to Login</a>
            </div>
        </div>
    </div>
</div>

{% endblock %}
